{% extends "base.html" %}
{% block title %}Capture #{{ capture_id }} · prompt-peek{% endblock %}

{% block content %}
<a href="/" class="back-link">← Back to list</a>

<div id="detail"></div>
<div id="loading"><span class="spinner"></span> Loading…</div>

<script>
const captureId = {{ capture_id }};

function statusClass(code) {
    if (!code) return 'status-0';
    if (code >= 200 && code < 300) return 'status-2xx';
    if (code >= 400 && code < 500) return 'status-4xx';
    if (code >= 500) return 'status-5xx';
    return 'status-0';
}

function fmtSize(bytes) {
    if (!bytes) return '?';
    if (bytes > 1_000_000) return (bytes/1_000_000).toFixed(1) + ' MB';
    if (bytes > 1_000) return (bytes/1_000).toFixed(1) + ' KB';
    return bytes + ' B';
}

function fmtTime(ts) {
    return new Date(ts * 1000).toLocaleString();
}

function formatJSON(obj) {
    try {
        return JSON.stringify(obj, null, 2);
    } catch(e) {
        return String(obj);
    }
}

async function load() {
    const res  = await fetch('/api/captures/' + captureId);
    const data = await res.json();
    const c    = data.capture;
    if (!c) {
        document.getElementById('loading').textContent = 'Capture not found.';
        return;
    }

    document.getElementById('loading').style.display = 'none';

    const stClass = statusClass(c.response_status);

    // ── Build prompt structure ─────────────────────────────
    let messagesHTML = '';
    if (c.request_body_parsed && c.request_body_parsed.messages) {
        messagesHTML = '<div class="section"><div class="section-title">📨 Messages (' + c.request_body_parsed.messages.length + ')</div><div class="message-list">';
        for (const msg of c.request_body_parsed.messages) {
            const role = msg.role || 'unknown';
            const content = typeof msg.content === 'string'
                ? msg.content
                : (msg.content ? formatJSON(msg.content) : '(empty)');
            const name = msg.name || '';
            const truncated = content.length > 500;
            const visible = truncated ? content.slice(0, 500) : content;
            messagesHTML += `
                <div class="message-item role-${role}">
                    <div class="message-header">
                        <span class="message-role">${role}</span>
                        ${name ? '<span class="message-name">' + name + '</span>' : ''}
                    </div>
                    <div class="message-content">
                        ${visible}
                        ${truncated ? '<span class="expand-btn" onclick="this.parentElement.classList.toggle(\'collapsed\');this.textContent=this.parentElement.classList.contains(\'collapsed\')?\'… show more\':\'\'">… show more</span>' : ''}
                    </div>
                </div>`;
        }
        messagesHTML += '</div></div>';
    }

    // ── System prompt extraction ───────────────────────────
    let systemPromptHTML = '';
    if (c.request_body_parsed && c.request_body_parsed.messages) {
        const sysMsg = c.request_body_parsed.messages.find(m => m.role === 'system');
        if (sysMsg) {
            const content = typeof sysMsg.content === 'string' ? sysMsg.content : formatJSON(sysMsg.content);
            systemPromptHTML = `
                <div class="section">
                    <div class="section-title">⚙️ System Prompt <span class="toggle" onclick="this.closest('.section').querySelector('.code-block').classList.toggle('hide')">toggle</span></div>
                    <div class="code-block"><pre>${escapeHTML(content)}</pre></div>
                </div>`;
        }
    }

    // ── Tools extraction ───────────────────────────────────
    let toolsHTML = '';
    if (c.request_body_parsed && c.request_body_parsed.tools) {
        toolsHTML = `
            <div class="section">
                <div class="section-title">🔧 Tools (${c.request_body_parsed.tools.length}) <span class="toggle" onclick="this.closest('.section').querySelector('.code-block').classList.toggle('hide')">toggle</span></div>
                <div class="code-block"><pre>${formatJSON(c.request_body_parsed.tools)}</pre></div>
            </div>`;
    }

    const rawLink = ` <a href="/raw/${c.id}" style="font-size:12px;font-weight:400;">(raw)</a>`;

    document.getElementById('detail').innerHTML = `
        <div class="detail-header">
            <div class="url">${c.method} ${c.url}</div>
            <div class="detail-meta">
                <span>${fmtTime(c.timestamp)}</span>
                <span>${c.host}</span>
                <span class="api-badge ${c.api_type}">${c.api_type}</span>
                <span class="status ${stClass}">${c.response_status || '…'}</span>
                <span>${c.duration_ms ? Math.round(c.duration_ms) + 'ms' : ''}</span>
                <span>req ${fmtSize(c.request_size)} · res ${fmtSize(c.response_size)}</span>
            </div>
        </div>

        ${systemPromptHTML}
        ${toolsHTML}
        ${messagesHTML}

        <div class="section">
            <div class="section-title">📤 Request Headers${rawLink} <span class="toggle" onclick="this.closest('.section').querySelector('.code-block').classList.toggle('hide')">toggle</span></div>
            <div class="code-block"><pre>${formatJSON(c.request_headers)}</pre></div>
        </div>

        <div class="section">
            <div class="section-title">📥 Response (${c.response_status || '…'})  <span class="toggle" onclick="this.closest('.section').querySelector('.code-block').classList.toggle('hide')">toggle</span></div>
            <div class="code-block"><pre>${c.response_body_parsed ? formatJSON(c.response_body_parsed) : (c.response_body ? escapeHTML(c.response_body) : '(empty)')}</pre></div>
        </div>

        <div class="section">
            <div class="section-title">📥 Response Headers <span class="toggle" onclick="this.closest('.section').querySelector('.code-block').classList.toggle('hide')">toggle</span></div>
            <div class="code-block"><pre>${formatJSON(c.response_headers)}</pre></div>
        </div>
    `;
}

function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

load();
</script>
{% endblock %}
